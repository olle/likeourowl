# ---------------------------------------------------------------------------
# Terminal chat mode - `java -jar like-our-owl.jar --cli`
# ---------------------------------------------------------------------------
# No web server, no banner, and quiet logging so the conversation stays
# readable. The application's own startup messages are still shown.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Re-enable Spring Shell, which the default (web) configuration excludes.
spring.autoconfigure.exclude=

logging.level.root=WARN
logging.level.com.studiomediatech.example.ai=INFO

# Spring AI logs every failed stream as an ERROR with a stack trace; the shell
# reports a concise message itself, so keep the terminal readable.
logging.level.org.springframework.ai.chat.model.MessageAggregator=OFF

# JLine keeps the command history across sessions, next to the data files.
spring.shell.config.location=./data
spring.shell.history.name=likeourowl-history.log
