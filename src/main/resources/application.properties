# ---------------------------------------------------------------------------
# Spring AI - OpenAI-compatible provider (LM Studio by default)
# ---------------------------------------------------------------------------
# Override per environment, either way:
#   LIKEOUROWL_AI_BASE_URL=http://host:1234/v1
#   java -jar app.jar --likeourowl.ai.base-url=http://host:1234/v1
likeourowl.ai.base-url=http://192.168.0.136:1234/v1

# The OpenAI Java SDK appends request paths (e.g. /chat/completions) to this
# base URL, so it must include the /v1 suffix - LM Studio serves its
# OpenAI-compatible API under /v1.
spring.ai.openai.base-url=${likeourowl.ai.base-url}

# LM Studio ignores API keys, but Spring AI requires a non-empty value.
spring.ai.openai.api-key=lm-studio

# Chat model to use, as listed by GET /v1/models on the LM Studio server.
# Other loaded model: meta/muse-glimmer
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# System prompt prepended to every conversation.
likeourowl.chat.system-prompt=You are LikeOurOwl, a concise and helpful AI assistant.

# ---------------------------------------------------------------------------
# DuckDB - embedded analytics database holding the railway context data
# ---------------------------------------------------------------------------
likeourowl.data.database-path=./data/likeourowl.duckdb
spring.datasource.url=jdbc:duckdb:${likeourowl.data.database-path}
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver

# Loaded into table 'services' on first start (1.9M rows, ~29 MB gzipped CSV).
# Table is kept in the database file, so later starts skip the download.
likeourowl.data.services-source=https://blobs.duckdb.org/nl-railway/services-2025-03.csv.gz
