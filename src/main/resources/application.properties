# ---------------------------------------------------------------------------
# Spring AI - OpenAI-compatible provider served by LM Studio on the LAN
# ---------------------------------------------------------------------------
# The OpenAI Java SDK appends request paths (e.g. /chat/completions) to this
# base URL, so it must include the /v1 suffix - LM Studio serves its
# OpenAI-compatible API under /v1.
spring.ai.openai.base-url=http://192.168.0.136:1234/v1

# LM Studio ignores API keys, but Spring AI requires a non-empty value.
spring.ai.openai.api-key=lm-studio

# Chat model to use, as listed by GET /v1/models on the LM Studio server.
# Other loaded model: meta/muse-glimmer
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# System prompt prepended to every conversation.
likeourowl.chat.system-prompt=You are LikeOurOwl, a concise and helpful AI assistant.
